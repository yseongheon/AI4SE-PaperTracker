[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4se-backend"
version = "0.1.0"
description = "AI4SE PaperTracker 后端：论文爬取、A 会匹配、AI4SE 分类与 API 服务"
readme = "README.md"
authors = [
    { name = "xiaoyf-debug", email = "3467760279@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "apscheduler>=3.11.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.1.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
